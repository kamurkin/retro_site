[package]
name = "retro_site"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.5", features = ["csr"] }
leptos_meta = "0.5"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "HtmlElement"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
